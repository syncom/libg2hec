name: 'CodeQL'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '45 0 * * 1'

jobs:
  analyze:
    name: 'Analyze'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler_c: [gcc]
        compiler_cxx: [g++]
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: 'Checkout repository'
      # v6.0.2
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    # Initializes the CodeQL tools for scanning.
    - name: 'Initialize CodeQL'
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}

    - name: 'Install build dependencies'
      run: |
        sudo apt-get update
        sudo apt-get install -y texinfo
        sudo apt-get install -y autotools-dev autoconf build-essential bear

    # Use custom build process for C/C++
    - name: 'Build'
      env:
        CC: ${{ matrix.compiler_c }}
        CXX: ${{ matrix.compiler_cxx }}
      run: |
        cd ${{ github.workspace }}
        autoreconf -vi
        ./scripts/build.sh 

    - name: 'Perform CodeQL analysis'
      # v2.25.5
      uses: github/codeql-action/analyze@84498526a009a99c875e83ef4821a8ba52de7c22
